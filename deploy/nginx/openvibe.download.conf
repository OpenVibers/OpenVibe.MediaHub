## ═══════════════════════════════════════════════════════════════
## openvibe.download — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.download.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 4990, systemd unit openvibe-media-hub) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=media-hub_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=media-hub_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=media-hub_forms:10m rate=1r/s;
# Form writes only: reading /files is a page like any other (an empty key is not counted; limit_req is not allowed
# inside limit_except).
map $request_method $media_hub_write_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $media_hub_write_key zone=media-hub_writes:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.download www.openvibe.download;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.download$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.download;

    ssl_certificate     /etc/letsencrypt/live/openvibe.download/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.download/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.download$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.download;

    include snippets/security-txt.conf;   # /.well-known/security.txt (host file; SECURITY.md in every repo)
    ssl_certificate     /etc/letsencrypt/live/openvibe.download/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.download/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.download.access.log;
    error_log  /var/log/nginx/openvibe.download.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=media-hub_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4990;
    }

    location /auth/ {
        limit_req zone=media-hub_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4990;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=media-hub_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4990;
    }

    # ── Uploads: bytes, and they stream through ─────────────
    # A plain <input type=file> form posts the whole file here in one request, up to MEDIAHUB_SINGLE_UPLOAD_BYTES
    # (256 MB by default) — keep this number in step with that variable. A larger file goes up in parts under
    # /api/v1/uploads/ below. Neither is buffered to disk first: a 256 MB body must not be a 256 MB nginx temp file.
    location = /files/upload {
        limit_req zone=media-hub_forms burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://127.0.0.1:4990;
    }

    # One part of a chunked upload (at most MEDIAHUB_PART_BYTES, 8 MB) and the session's status and complete calls.
    location ~ ^/api/v1/uploads/ {
        limit_req zone=media-hub_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://127.0.0.1:4990;
    }

    # ── Downloads: streamed from OpenVibe.Media through the app ──
    # The app answers every download itself (Content-Disposition: attachment, nosniff, an opaque type for anything
    # not on the safe list), so these must not be buffered: nginx would hold the whole file before sending a byte.
    location ~ ^/(files/[^/]+/download|s/[^/]+/download|s/[^/]+/f/[^/]+/download)$ {
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_pass http://127.0.0.1:4990;
    }

    # ── Form writes (the upload form is the exact match above) ──
    location ~ ^/(files|folders|shares|staff)(/|$) {
        limit_req zone=media-hub_writes burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4990;
    }

    # ── Loopback only: OpenVibe.Events' deliveries (account export and deletion) and Prometheus ──
    location /internal/ { return 404; }
    location = /metrics { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:4990;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── openvibe.pics and openvibe.video: parked. They redirect to openvibe.network until Pics and Video are built. ──
# No app is behind these hosts: every request is answered here with a 302, and nothing is proxied.
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.pics www.openvibe.pics openvibe.video www.openvibe.video;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 302 https://openvibe.network/; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.pics;
    ssl_certificate     /etc/letsencrypt/live/openvibe.pics/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.pics/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 302 https://openvibe.network/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.pics;
    ssl_certificate     /etc/letsencrypt/live/openvibe.pics/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.pics/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 302 https://openvibe.network/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.video;
    ssl_certificate     /etc/letsencrypt/live/openvibe.video/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.video/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 302 https://openvibe.network/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.video;
    ssl_certificate     /etc/letsencrypt/live/openvibe.video/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.video/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 302 https://openvibe.network/;
}
